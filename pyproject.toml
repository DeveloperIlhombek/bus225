[project]
name = "bus225-bot"
version = "2.0.0"
description = "225-yo'nalish avtobus jadvali Telegram boti"
requires-python = ">=3.11"
dependencies = [
    "aiogram>=3.15,<4",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "ruff>=0.6",
    "mypy>=1.11",
]

[project.scripts]
bus225-bot = "bot.__main__:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["bot", "bot.data", "bot.handlers", "bot.keyboards", "bot.services"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["bot"]
ignore_missing_imports = true
