# Testlar + Mini App'ni GitHub Pages'ga joylash.
# Manzil: https://<user>.github.io/<repo>/  (Settings → Pages → Source: GitHub Actions)
name: Mini App → GitHub Pages

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Bot — o'rnatish
        run: pip install -e ".[dev]"
      - name: route.json timetable.json bilan mosmi
        run: python -m tools.build_route --check
      - name: Bot — tekshiruvlar
        run: |
          ruff check bot tools tests
          mypy
          pytest

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Mini App — tekshiruvlar
        working-directory: web
        run: |
          npm ci
          npm run typecheck
          npm run lint
          npm test

  build:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Statik eksport
        working-directory: web
        env:
          BASE_PATH: /${{ github.event.repository.name }}
          NEXT_PUBLIC_API_URL: ${{ vars.API_URL || 'https://bus.mentorme.uz' }}
          NEXT_TELEMETRY_DISABLED: 1
        run: |
          npm ci
          npm run build
          touch out/.nojekyll
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web/out

  deploy:
    if: github.ref == 'refs/heads/master' && github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
