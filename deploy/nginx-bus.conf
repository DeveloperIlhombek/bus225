# /etc/nginx/sites-available/bus.mentorme.uz
# HTTPS sertifikatini certbot qo'shadi: sudo certbot --nginx -d bus.mentorme.uz
server {
    listen 80;
    server_name bus.mentorme.uz;

    location /api/ {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
        client_max_body_size 16k;
    }

    location / {
        return 302 https://developerilhombek.github.io/bus225/;
    }
}
